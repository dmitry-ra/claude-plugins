name: test

on:
  push:
    branches: [develop, main, 'release/**']
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # The plugin directory and the test files each arrive at their own commit,
      # so a history replayed commit by commit reaches this job before either
      # exists. Declaring the directory as a job-level default would fail the run
      # on the commits that precede it.
      - run: |
          if [ ! -f plugins/file-channel/package.json ]; then echo "no plugin at this commit"; exit 0; fi
          cd plugins/file-channel
          bun install
          if ls *.test.ts >/dev/null 2>&1; then bun test; else echo "no test files at this commit"; fi
